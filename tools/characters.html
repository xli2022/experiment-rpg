<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Afterlight · Character studio</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: dark; font: 14px/1.5 system-ui, sans-serif; color: #e5e9e7; background: #10181e; }
    body { margin: 0; }
    header { padding: 20px 28px; border-bottom: 1px solid #ffffff15; display: flex; gap: 24px; align-items: center; justify-content: space-between; }
    h1 { font-size: 19px; font-weight: 500; margin: 0; letter-spacing: .06em; }
    .eyebrow { color: #a3ccb9; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; }
    a { color: #a3ccb9; text-decoration: none; }
    main { display: grid; grid-template-columns: 254px 1fr; min-height: calc(100vh - 89px); }
    aside { padding: 24px; border-right: 1px solid #ffffff15; }
    label { display: block; margin-bottom: 18px; color: #9daeb5; font-size: 12px; }
    select, button { font: inherit; color: #e5e9e7; background: #1d2b33; border: 1px solid #ffffff22; border-radius: 5px; padding: 9px 12px; min-height: 40px; }
    select { width: 100%; margin-top: 6px; }
    button { cursor: pointer; }
    button:hover { border-color: #a3ccb9; }
    button:disabled { opacity: .35; cursor: default; }
    input[type=range] { width: 100%; accent-color: #a3ccb9; margin-top: 10px; }
    input[type=checkbox] { accent-color: #a3ccb9; }
    .buttons { display: flex; gap: 8px; margin-bottom: 20px; }
    #status, .help { font-size: 12px; color: #8b9da5; }
    #status { margin-top: 26px; }
    #viewport { min-width: 0; position: relative; height: calc(100vh - 89px); min-height: 450px; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
    #captions { position: absolute; left: 5%; right: 5%; bottom: 24px; display: flex; justify-content: space-around; pointer-events: none; gap: 8px; }
    .caption { text-align: center; width: 25%; }
    .caption strong { display: block; font-size: 13px; font-weight: 500; }
    .caption small { color: #8b9da5; font-size: 10px; }
    #page-label { font-size: 11px; margin: -10px 0 20px; color: #9daeb5; }
    @media (max-width: 700px) {
      header { padding: 16px; } main { grid-template-columns: 1fr; }
      aside { display: flex; flex-wrap: wrap; gap: 12px; padding: 16px; border-right: 0; }
      aside label { min-width: 120px; flex: 1; margin: 0; } .buttons { margin: 0; }
      .help, #page-label { display: none; } #status { width: 100%; margin: 0; }
      #viewport { height: 65vh; } .caption strong { font-size: 10px; }
    }
  </style>
</head>
<body>
  <header><div><div class="eyebrow">Afterlight / Art development</div><h1>Character studio</h1></div><a href="../">Back to the city ↗</a></header>
  <main>
    <aside>
      <label>Collection<select id="collection"><option value="cast">Story cast</option><option value="bases">Human base models</option><option value="human">Human residents</option><option value="robot">Robots</option><option value="alien">Aliens</option><option value="player">Vex</option></select></label>
      <label>Animation<select id="animation"><option>Idle</option></select></label>
      <label>Lighting<select id="lighting"><option value="studio">Neutral studio</option><option value="city">Afterlight night</option></select></label>
      <label>Playback <output id="rate-label">1×</output><input id="rate" type="range" min="0.1" max="2" step="0.1" value="1"></label>
      <label><input type="checkbox" id="turntable"> Turntable</label>
      <div class="buttons"><button id="previous" aria-label="Previous models">←</button><button id="next" aria-label="Next models">→</button><button id="pause">Pause</button></div>
      <p id="page-label"></p>
      <p class="help">Drag to orbit. Scroll to zoom. Inspect the same textures, skeletons and wardrobe used in the city.</p>
      <div id="status" role="status">Loading character assets…</div>
    </aside>
    <section id="viewport" aria-label="Animated character preview"><canvas></canvas><div id="captions"></div></section>
  </main>
  <script type="module" src="../src/character-studio.js"></script>
</body>
</html>
